name: Build, Test & Manual Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests with pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cd backend
          pytest --cov=app --cov-report=xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        env:
          VITE_API_URL: http://10.103.1.201:8080/api
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy Frontend
        run: |
          # Supprime l'ancien site et copie le nouveau, directement via le terminal.
          rm -rf /var/www/html/rousseau/*
          cp -r dist/* /var/www/html/rousseau/

      - name: Deploy Backend
        run: |
          cd /home/rousseau/projet_rousseau
          
          git pull origin main
          
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          
          pkill -f "uvicorn app.main:app" || true
          sleep 2
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8080 > api.log 2>&1 &