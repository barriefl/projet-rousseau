services:
  docker-cleaner:
    image: docker:latest
    container_name: rousseau_cleaner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "while true; do
                sleep 86400;
                docker system prune -f --volumes;
              done"
    restart: unless-stopped
    networks:
      - rousseau_net
  db:
    image: postgres:15-alpine
    container_name: rousseau_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rousseau_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 0s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M

  pgadmin:
    image: dpage/pgadmin4
    container_name: rousseau_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  languagetool:
    image: meyay/languagetool
    container_name: rousseau-languagetool
    restart: unless-stopped
    ports:
      - "8010:8081"
    environment:
      - Java_Xms=128m
      - Java_Xmx=512m
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    volumes:
      - languagetool_fasttext:/fasttext
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 600M
    
  backend:
    build:
      context: ./backend
    container_name: rousseau_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATA_DIR=/data
      - LANGUAGETOOL_URL=http://languagetool:8081
    depends_on:
      db:
        condition: service_healthy
      languagetool:
        condition: service_started
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M

  frontend:
    build:
      context: ./frontend
    container_name: rousseau_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  languagetool_fasttext:

networks:
  rousseau_net:
    driver: bridge