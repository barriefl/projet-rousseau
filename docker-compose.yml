services:
  db:
    image: postgres:15-alpine
    container_name: rousseau_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rousseau_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 0s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  pgadmin:
    image: dpage/pgadmin4
    container_name: rousseau_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rousseau.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
  backend:
    build:
      context: ./backend
    container_name: rousseau_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATA_DIR=/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rousseau_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  
  languagetool:
    image: meyay/languagetool
    container_name: rousseau-languagetool
    ports:
      - "8010:8081"
    environment:
      - Java_Xms=256m
      - Java_Xmx=512m
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true

volumes:
  postgres_data:

networks:
  rousseau_net:
    driver: bridge